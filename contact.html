<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Limidation Construction Inc.</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header>
  <div class="brand">
    <a href="index.html" style="display:flex; align-items:center;">
      <img src="images/navbar-logo-white.png" alt="Limidation Construction Inc." style="height:44px;">
    </a>
  </div>
  <nav>
    <a href="index.html"><span data-en>Home</span><span data-zh>首页</span></a>
    <a href="about.html"><span data-en>About</span><span data-zh>关于我们</span></a>
    <a href="projects.html"><span data-en>Projects</span><span data-zh>项目案例</span></a>
    <a href="team.html"><span data-en>Team</span><span data-zh>团队</span></a>
    <a href="contact.html"><span data-en>Contact</span><span data-zh>联系我们</span></a>
  </nav>
  <button id="lang-toggle">中文</button>
</header>

<section>
  <h2><span data-en>Get in Touch</span><span data-zh>联系我们</span></h2>
  <p style="text-align:center; color:#8a8a8a; max-width:500px; margin:0 auto 30px;">
    <span data-en>Send us a message about your project and we'll get back to you.</span>
    <span data-zh>留下你的装修需求，我们会尽快回复。</span>
  </p>

  <!-- name="contact" 和 data-netlify="true" 是关键：
       网站部署到 Netlify 后，这个表单会自动被识别，
       提交的内容会出现在 Netlify 后台，不需要额外写后端代码。 -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p style="display:none;">
      <label>Don't fill this out: <input name="bot-field"></label>
    </p>

    <label for="name"><span data-en>Name</span><span data-zh>姓名</span></label>
    <input type="text" id="name" name="name" required>

    <label for="phone"><span data-en>Phone or Email</span><span data-zh>电话或邮箱</span></label>
    <input type="text" id="phone" name="phone" required>

    <label for="message"><span data-en>Tell us about your project</span><span data-zh>描述你的装修需求</span></label>
    <textarea id="message" name="message" required></textarea>

    <button type="submit"><span data-en>Send Message</span><span data-zh>提交</span></button>
  </form>
</section>

<footer>
  <p>&copy; 2026 Limidation Construction Inc. · limidation.ca</p>
</footer>

<script src="JS/lang.js"></script>
</body>
</html>
